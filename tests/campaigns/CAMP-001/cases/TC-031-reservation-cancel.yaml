id: TC-031
title: Annulation complète d'une réservation d'un kit
priority: P0
requirement: L4 - Annulation et désactivation d'une réservation
preconditions:
  - Application connectée sous TEST_ADMIN.
  - Base de test réinitialisée avec une réservation active dédiée RESA_031, portant sur le seul kit TEST-K-031 et une date future.
test_data:
  - "Réservation active : RESA_031, un seul kit TEST-K-031"
steps:
  - number: 1
    action: Afficher les réservations de l'utilisateur lié à RESA_031 et sélectionner la réservation.
    expected: TEST-K-031 et les données de RESA_031 sont visibles.
  - number: 2
    action: Demander la suppression de la réservation puis confirmer dans la boîte de confirmation.
    expected: La réservation disparaît ou est signalée inactive dans l'IHM.
  - number: 3
    action: Contrôler RESA_031 dans la base de test et rechercher TEST-K-031 pour la même date.
    expected: La réservation est désactivée, aucune ligne active ne subsiste et le kit n'est plus affiché comme réservé pour cette date.
  - number: 4
    action: Consulter les logs de l'utilisateur et du kit.
    expected: L'annulation est tracée sans altérer un autre enregistrement de test.
pass_criteria:
  - La réservation dédiée est intégralement désactivée.
  - Le kit redevient disponible pour la date testée.
  - Une trace d'annulation existe.
automation:
  candidate: true
  target: QtTest
notes: "Ce cas ne couvre pas l'annulation partielle, hors périmètre initial."
