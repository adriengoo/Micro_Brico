id: TC-030
title: Création d'une réservation future pour un kit unique
priority: P0
objective: Vérifier la création d'une réservation active et traçable d'un kit unique pour un utilisateur à caution payée.
requirement: L4 - Création et persistance d'une réservation
preconditions:
  - Application connectée sous TEST_ADMIN.
  - Base de test réinitialisée avec TEST_USER_030 et TEST-K-030 disponibles, non en panne et non réservés pour la date de test.
  - La date TEST_DATE_030 vaut J+7, calculée le jour de l'exécution.
test_data:
  - "Utilisateur : TEST_USER_030"
  - "Kit unique : TEST-K-030"
  - "Date : TEST_DATE_030 = J+7"
steps:
  - number: 1
    purpose: Préparer une réservation dont la disponibilité est connue.
    action: "Étape 1 — Sélectionner J+7, rechercher TEST-K-030 et l'ajouter au panier."
    expected: Le panier contient exactement TEST-K-030.
  - number: 2
    purpose: Vérifier qu'un utilisateur à caution payée peut réserver.
    action: "Étape 2 — Saisir TEST_USER_030, dont adhesion_payed=1 dans la fixture, puis créer la réservation."
    expected: La création est confirmée sans message d'erreur.
  - number: 3
    purpose: Vérifier la relation persistée utilisateur-kit-date et son état actif.
    action: "Étape 3 — Afficher les réservations de TEST_USER_030 puis contrôler resa par id_user, id_kit, start_date=J+7 et is_active=1."
    expected: Une réservation active relie TEST_USER_030, TEST-K-030 et TEST_DATE_030 ; aucun autre kit n'est associé.
  - number: 4
    purpose: Vérifier la traçabilité minimale de l'opération.
    action: "Étape 4 — Consulter les logs utilisateur et kit associés au numéro de réservation créé."
    expected: La réservation est tracée avec un identifiant de réservation et les références du test.
pass_criteria:
  - La réservation active contient exactement l'utilisateur, le kit et la date demandés.
  - Le kit apparaît réservé pour TEST_DATE_030.
  - Une trace liée à l'utilisateur et au kit existe.
automation:
  candidate: true
  target: QtTest
notes: "RM-001 est validée. Fixture déterministe requise : ids, hash, adhesion_payed, compteur uid_resa et convention de sélection du numéro généré."
