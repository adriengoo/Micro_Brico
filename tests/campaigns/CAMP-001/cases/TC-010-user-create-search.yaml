id: TC-010
title: Création puis recherche d'un utilisateur dédié
priority: P1
objective: Vérifier qu'un administrateur crée un utilisateur complet et le retrouve par utinfo et par nom.
requirement: L2 - Gestion et recherche des utilisateurs
preconditions:
  - Application connectée sous TEST_ADMIN.
  - Base de test réinitialisée ; l'utinfo TEST_U_010 est absent.
test_data:
  - "Utilisateur : TEST_U_010, nom Martin, prénom Test, courriel test-u-010@example.invalid"
steps:
  - number: 1
    purpose: Créer une ligne utilisateur avec toutes les données fixture.
    action: "Étape 1 — Ouvrir l'ajout utilisateur, renseigner toutes les données fixture obligatoires, puis valider."
    expected: Un message de succès ou une ligne nouvellement créée confirme l'ajout.
  - number: 2
    purpose: Vérifier les deux chemins de recherche.
    action: "Étape 2 — Rechercher l'utilisateur par utinfo TEST_U_010 puis par nom Martin."
    expected: La recherche retourne l'utilisateur créé avec les valeurs saisies.
  - number: 3
    purpose: Vérifier la persistance complète, au-delà de l'affichage.
    action: "Étape 3 — Contrôler la ligne utilisateur dans la base de test par son utinfo."
    expected: Une seule ligne correspond et ses champs fonctionnels concordent avec les données saisies.
pass_criteria:
  - L'utilisateur créé est retrouvé par les deux recherches.
  - Les données affichées et persistées concordent.
automation:
  candidate: true
  target: QtTest
notes: "RM-002 est validée. Restent à fournir : tous les champs fixture, les objectName et les valeurs SQL attendues."
