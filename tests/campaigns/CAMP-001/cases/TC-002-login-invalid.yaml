id: TC-002
title: Refus d'une connexion avec mot de passe invalide
priority: P1
objective: Vérifier qu'un mot de passe incorrect n'ouvre pas de session ni ne change le jeton de l'utilisateur.
requirement: L1 - Refus des identifiants invalides
preconditions:
  - Application démarrée, sans session ouverte, connectée à la base de test dédiée.
  - Le compte TEST_ADMIN existe avec un mot de passe différent de « mauvais-mdp ».
test_data:
  - "Utinfo : TEST_ADMIN"
  - "Mot de passe : mauvais-mdp"
steps:
  - number: 1
    purpose: Soumettre une authentification volontairement invalide.
    action: "Étape 1 — Ouvrir login_connect, saisir les données de test dans lineEdit_utinfo et lineEdit_mdp, puis cliquer pushButton_ok."
    expected: La connexion est refusée par un message compréhensible.
  - number: 2
    purpose: Vérifier que le refus ne donne pas d'accès IHM.
    action: "Étape 2 — Fermer le message et observer l'application."
    expected: Aucun utilisateur n'est connecté et les actions protégées restent inactives.
  - number: 3
    purpose: Vérifier l'absence d'effet de bord persistant.
    action: "Étape 3 — Comparer le token SQL de TEST_ADMIN à sa valeur initiale fixture."
    expected: Le token est inchangé.
pass_criteria:
  - Aucun accès authentifié n'est accordé avec le mot de passe invalide.
  - L'application reste utilisable après le refus.
automation:
  status: automated
  candidate: true
  target: QtTest
  ctest: CAMP-001.tc002_login_invalid
notes: "Le token initial et l'accès SQL de lecture sont requis. SHA-1 est hors correction CAMP-001."
