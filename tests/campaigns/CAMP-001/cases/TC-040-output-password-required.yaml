id: TC-040
title: Sortie refusée tant que le mot de passe n'est pas validé
priority: P0
objective: Vérifier qu'une sortie standard exige la session administrateur et l'identification de l'utilisateur bénéficiaire.
requirement: L5 - Autorisation préalable à la sortie
preconditions:
  - Application connectée sous TEST_ADMIN.
  - Base de test réinitialisée avec TEST_USER_040 et une réservation active à J+7 pour le seul kit TEST-K-040.
  - TEST-K-040 possède un item TEST_ITEM_040 de quantité 2.
test_data:
  - "Utilisateur : TEST_USER_040"
  - "Kit : TEST-K-040 ; item TEST_ITEM_040 ; quantité initiale 2"
steps:
  - number: 1
    purpose: Positionner une sortie standard sans encore satisfaire l'identification requise.
    action: "Étape 1 — Dans l'onglet sorties, sélectionner TEST_USER_040 puis TEST-K-040 de sa réservation J+7."
    expected: Le statut demande un mot de passe avant la sortie et le bouton de sortie reste indisponible ou la sortie est refusée.
  - number: 2
    purpose: Vérifier le refus avant identification du bénéficiaire.
    action: "Étape 2 — Tenter de déclencher la sortie sans saisir ni valider le mot de passe de TEST_USER_040."
    expected: Un avertissement indique la validation requise ; aucune sortie n'est créée.
  - number: 3
    purpose: Vérifier l'absence de demi-opération sur sortie et stock.
    action: "Étape 3 — Contrôler sortie active pour TEST-K-040 et quantity/quantity_out de TEST_ITEM_040."
    expected: Aucune sortie active supplémentaire n'existe et la quantité reste 2.
pass_criteria:
  - Une sortie sans validation de mot de passe ne modifie ni sorties ni stock.
  - L'opérateur reçoit un retour explicite.
automation:
  candidate: true
  target: QtTest
notes: "RM-002 est validée. Fixture : ids, hashes, réservation id_resa, J+7, compteurs et valeurs item détaillées restent requis."
