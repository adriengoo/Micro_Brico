# Contrat minimal d'une fiche de test. Les futures fiches doivent respecter ces champs.
id: TC-XXX
title: Titre court et unique
priority: P0 # P0 (bloquant), P1, P2 ou P3
objective: But général du test, formulé indépendamment de ses étapes
requirement: Fonction ou règle métier couverte
preconditions:
  - Application, données et droits nécessaires
test_data:
  - Donnée d'entrée pertinente
steps:
  - number: 1
    purpose: Pourquoi cette étape est exécutée et ce qu'elle doit démontrer
    action: Action reproductible pour l'opérateur ou l'automate
    expected: Résultat observable et vérifiable
pass_criteria:
  - Condition nécessaire au statut PASS
automation:
  candidate: false
  target: null # Exemple : QtTest ou pytest-qt
notes: null
